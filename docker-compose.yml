version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment:
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
    - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
    # Pass GE / Warehouse PostgreSQL connections to Airflow just in case
    - DB_HOST=postgres
    - DB_PORT=5432
    - WAREHOUSE_DB=${WAREHOUSE_DB}
    - WAREHOUSE_USER=${WAREHOUSE_USER}
    - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./data:/data
    - ./great_expectations:/opt/airflow/great_expectations
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13-alpine
    container_name: dq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Custom variables for pg_init.sql
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_USER: ${AIRFLOW_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}
      GE_DB: ${GE_DB}
      GE_USER: ${GE_USER}
      GE_PASSWORD: ${GE_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/pg_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    container_name: dq-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: dq-airflow-scheduler
    command: scheduler

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: dq-spark-master
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"  # Expose Spark Web UI on 9090 to avoid conflict with Airflow webserver
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - DB_HOST=postgres
      - DB_PORT=5432
      - GE_DB=${GE_DB}
      - GE_USER=${GE_USER}
      - GE_PASSWORD=${GE_PASSWORD}
      - WAREHOUSE_DB=${WAREHOUSE_DB}
      - WAREHOUSE_USER=${WAREHOUSE_USER}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD}
    volumes:
      - ./data:/data
      - ./spark/jobs:/opt/spark/jobs
      - ./great_expectations:/opt/great_expectations

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: dq-spark-worker
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER_URL=spark://spark-master:7077
      - DB_HOST=postgres
      - DB_PORT=5432
      - GE_DB=${GE_DB}
      - GE_USER=${GE_USER}
      - GE_PASSWORD=${GE_PASSWORD}
      - WAREHOUSE_DB=${WAREHOUSE_DB}
      - WAREHOUSE_USER=${WAREHOUSE_USER}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD}
    volumes:
      - ./data:/data
      - ./spark/jobs:/opt/spark/jobs
      - ./great_expectations:/opt/great_expectations

  nginx:
    image: nginx:alpine
    container_name: dq-nginx
    ports:
      - "8082:80"
    volumes:
      - ./great_expectations/uncommitted/data_docs/local_site:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
